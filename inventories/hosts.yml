---
# Example inventory for targeted security package updates.
#
# Replace the example host below with your own servers.
# Add more hosts under a group, or create additional groups as needed.
#
# Common per-host variables:
#   ansible_host: IP or hostname Ansible should connect to
#   ansible_user: SSH user (must have sudo on the target)
#   ansible_port: SSH port (default: 22)
#   ansible_ssh_private_key_file: path to your SSH private key

all:
  children:
    webservers:
      hosts:
        example.host.com:
          ansible_host: 192.0.2.10
          ansible_user: ansible
